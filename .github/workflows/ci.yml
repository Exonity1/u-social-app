name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    name: App – Lint und Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci

  db:
    name: Datenbank – Supabase lokal starten und pgTAP-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Supabase-CLI kommt als devDependency aus package.json (gleiche Version wie lokal)
      - run: npm ci
      # Startet Postgres, Auth, Storage usw. per Docker; Migrations werden dabei angewendet.
      # Dienste, die für die Tests nicht nötig sind, werden ausgelassen.
      - run: npx supabase start -x studio,imgproxy,logflare,vector,edge-runtime
      - run: npx supabase test db
      - if: always()
        run: npx supabase stop --no-backup
